name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, or anything that could let recorded history be altered
        undetectably, please report it privately instead — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PriorState version
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Bundled docker compose, unmodified
        - Bundled docker compose, modified
        - Own deployment (Kubernetes, etc.)
        - From source, for development
    validations:
      required: true
  - type: input
    id: storage
    attributes:
      label: Object storage backend
      placeholder: "Garage (bundled), Backblaze B2, AWS S3, Ceph RGW, ..."
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
